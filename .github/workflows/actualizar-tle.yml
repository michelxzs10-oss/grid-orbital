name: Actualizar órbitas

on:
  schedule:
    - cron: '17 */12 * * *'   # cada 12 horas
  workflow_dispatch:           # también se puede lanzar a mano desde GitHub

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/descargar-tle.mjs
      - name: Guardar las órbitas nuevas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/tle
          git diff --cached --quiet || (git commit -m "Actualizar órbitas" && git push)
